<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 80%;
            text-align: center;
            border: 1px solid black;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        th {
            font-weight: bold;
        }

        .morning {
            background-color: #ffffcc;
        }

        .afternoon {
            background-color: #ccffcc;
        }

        .evening {
            background-color: #ccccff;
        }
    </style>
</head>
<body>
    <table>
        <tr>
        <th rowspan="3">Day</th>
        <th colspan="3">Seminar</th>
    </tr>

    <tr>
        <th colspan="2">Schedule</th>
        <th rowspan="2">Topic</th>
    </tr>

    <tr>
        <th>Begin</th>
        <th>End</th>
    </tr>

    <!-- Monday -->
    <tr>
        <td rowspan="2">Monday</td>

        <td rowspan="2" class="morning">
            8:00 a.m.
        </td>

        <td rowspan="2" class="evening">
            5:00 p.m.
        </td>

        <td>
            Introduction to XML
        </td>
    </tr>

    <tr>
        <td>
            Validity: DTD and Relax NG
        </td>
    </tr>

    <!-- Tuesday -->
    <tr>
        <td rowspan="3">Tuesday</td>

        <td class="morning">
            8:00 a.m.
        </td>

        <td class="morning">
            11:00 a.m.
        </td>

        <td rowspan="2">
            XPath
        </td>
    </tr>

    <tr>
        <td class="morning">
            11:00 a.m.
        </td>

        <td class="afternoon">
            2:00 p.m.
        </td>

    </tr>

    <tr>
        <td class="afternoon">
            2:00 p.m.
        </td>

        <td class="evening">
            5:00 p.m.
        </td>

        <td>
            XSL Transformations
        </td>
    </tr>

    <!-- Wednesday -->
    <tr>
        <td>Wednesday</td>

        <td class="morning">
            8:00 a.m.
        </td>

        <td class="afternoon">
            12:00 p.m.
        </td>

        <td>
            XSL Formatting Objects
        </td>
    </tr>

</table>
</body>
</html>
