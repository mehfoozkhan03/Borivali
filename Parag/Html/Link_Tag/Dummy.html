<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Tag</title>
</head>
<body>
    <h1>Content </h1>

    <p>
        <a href="../frog.png" target="_top">top</a>
    </p>

    <p>
        <a href="../frog.png" target="_self">self</a>
    </p>

    <p>
        <a href="../frog.png" target="_parent">parent</a>
    </p>

    <p>
        <a href="../frog.png" target="_blank">blank</a>
    </p>
</body>
</html>
