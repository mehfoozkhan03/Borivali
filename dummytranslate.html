<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .parent {
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        align-self: center;
        margin: 10rem 0;
        overflow-x: scroll;
        gap: 20px;
        height: 80vh;
      }

      .box {
        background: rebeccapurple;
        color: #fff;
        width: 300px;
        height: 200px;
        padding: 5rem 0;
        font: 900 2rem bolder;
        text-align: center;
        transition: all 2s ease-in-out;
        text-transform: capitalize;
        flex-shrink: 0;
      }

      .child_1:hover {
        translate: 30% 40%;
        background: tomato;
      }
      .child_2:hover {
        rotate: 90deg;
        background: tomato;
      }
      .child_3:hover {
        transform: skew(-190deg);

        background: tomato;
      }
      .child_4:hover {
        scale: 3;
        translate: -120% 30%;

        background: tomato;
      }
      .child_5:hover {
        transform: skewX(70deg);
        /* translate: -120% 30%; */

        background: rosybrown;
      }
      .child_6:hover {
        transform: skewY(70deg);
        /* translate: -120% 30%; */

        background: rosybrown;
      }
      .child_7:hover {
        transform: scaleX(2);
        /* translate: -120% 30%; */

        background: royalblue;
      }
      .child_8:hover {
        transform: scaleY(4);
        /* translate: -120% 30%; */

        background: royalblue;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="child_1 box">translate</div>
      <div class="child_2 box">rotate</div>
      <div class="child_3 box">skew</div>
      <div class="child_4 box">scale</div>

      <div class="child_5 box">skew X</div>
      <div class="child_6 box">skew Y</div>
      <div class="child_7 box">scale X</div>
      <div class="child_8 box">scale Y</div>
    </div>
  </body>
</html>
