 div + div{

    <div class="demo_1">
        <div>
             <h1 class="demo_child_1">hello_1</h1>

             <h1 class="demo_child_2">hello_4</h1>

        </div>
       
        

    </div>

    <!--3. sibling {" + "}-->
    <div class="demo_1">
        <h1>hello_1</h1>
        <h1>hello_1</h1>
    </div>

     <div class="demo_2">
        <h1>hello_1</h1>
