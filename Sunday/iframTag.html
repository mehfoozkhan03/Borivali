<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .mapouter {
        position: relative;
        text-align: right;
        width: 600px;
        height: 400px;
      }
      .gmap_canvas {
        overflow: hidden;
        background: none !important;
        width: 600px;
        height: 400px;
      }
      .gmap_iframe {
        width: 600px !important;
        height: 400px !important;
      }
    </style>
  </head>
  <body>
    <h1>iframe tag</h1>

    <iframe
      width="933"
      height="525"
      src="https://www.youtube.com/embed/Y6GJJ0u4xT0"
      title="Los Angeles Lakers vs Golden State Warriors - FULL GAME HIGHLIGHTS | October 6, 2026 NBA Preseason"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <!-- map -->

    <div class="mapouter">
      <div class="gmap_canvas">
        <iframe
          class="gmap_iframe"
          frameborder="0"         
          src="https://maps.google.com/maps?width=600&amp;height=400&amp;hl=en&amp;q=borivali;t=&amp;z=14&amp;ie=UTF8&amp;iwloc=B&amp;output=embed"
        ></iframe
        ><a href="https://embed-googlemap.com">embed google map</a>
      </div>
    </div>
  </body>
</html>
