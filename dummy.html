<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        display: flex;
        /* justify-content: center;
        align-items: center; */
        border: 2px solid gray;
        /* flex-wrap: wrap; */

        & > h3:first-child {
          background: red;
          /* flex-grow:.5; */
          width: 200px;
        }
        
        & > h3:nth-child(2) {
          background: royalblue;
          width: 200px;
          flex-shrink: 7;
        }
        
        & > h3:last-child {
          background: tan;
          width: 200px;
        }
      }
    </style>
  </head>
  <body>
    <div>
      <h3>hello1</h3>
      <h3>hello2</h3>
      <h3>hello3</h3>
    </div>
  </body>
</html>
