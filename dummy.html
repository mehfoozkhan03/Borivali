<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      nav {
        background: transparent;
        width: 100%;
        height: 30vh;
        border: 2px solid red;
      }

      nav::after,
      nav::before {

        content: "";
        width: 200px;
        height: 100px;
        background: rebeccapurple;
        display: block;
        border: 2px solid  green;
        clip-path: ellipse(130px 50px at 10% 20%);
      }

    </style>
  </head>
  <body>
    <nav></nav>
  </body>
</html>
