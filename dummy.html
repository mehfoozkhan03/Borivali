<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>selectors</title>
    <style>
      /* h1{
      color: blue;
    } */
      .heading_1 {
        color: red;
      }
      #heading_2 {
        color: green;
      }
      h1 {
        color: blue;
      }

      /****  selector *****/

      /* desendent  " " */

      div h3 {
        color: rebeccapurple;
      }

      /* child  {>}*/

      div > span > h3 {
        color: brown;
      }

      /* sibling (+)*/
/* 
      h6 + h5 {
        color: yellowgreen;
      } */

      /* sub-sibling [~]*/
      div ~ 
      *{
        color: aquamarine;
      }
    </style>
  </head>
  <body>
    <h1>hello</h1>
    <h1 class="heading_1">hello</h1>
    <h1 id="heading_2">hello</h1>

    <div>
      <span>
        <h3>hello</h3>
      </span>
    </div>
    <h6>h6</h6>
    <h5>h5</h5>
  </body>
</html>
