<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .parent {
        background: tomato;
        border: 2px solid red;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        padding: 1rem 0;
        height: 90vh;
        perspective: 600px;
      }

      .box {
        width: 300px;
        height: fit-content;
        background: tan;
        border: 1px dashed green;
        padding: 10% 0;
        text-align: center;
        transition: all 0.3s ease-in;
      }

      .child_1:hover {
        transform: rotateX(180deg);
      }
      .child_2:hover {
        transform: rotateY(180deg);
      }
      .child_4:hover {
        translate: -200px 50px;
        transform: translateZ(100px);
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="child_1 box">Rotate X</div>
      <div class="child_2 box">Rotate Y</div>
      <div class="child_3 box">Rotate Z</div>
      <div class="child_4 box">translate Z</div>
    </div>
  </body>
</html>
