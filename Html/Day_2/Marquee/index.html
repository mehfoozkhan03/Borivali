<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marquee</title>
    <style>
        div {
            border: 2px solid grey;
            border-left-width: 3px;
            border-left-color: red;
            border-right-color: red;

        }

        h2 {
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: red;
        }
    </style>
</head>

<body>
    <h2>hello</h2>
    <div>hello</div>
    <!-- hw :- scrollamout -->
    <marquee height="100" behavior="alternate" direction="down" bgcolor="tomato" hspace="50px" vspace="30px"
        scrolldelay="5" truespeed>
        <span>hello</span>
    </marquee>

</body>

</html>
