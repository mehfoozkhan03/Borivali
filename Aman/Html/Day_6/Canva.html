<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas in html</title>
</head>

<body>

    <canvas id="myCanvas" name="canva_design" width="800" height="600" style="border:1px solid gray">
        Your browser does not support the HTML canvas tag.
    </canvas>

    <script>
        // here we write canvas code...

        const canvas = document.querySelector("#myCanvas");
        const dis = canvas.getContext("2d");

        // draw rectangle
        dis.fillStyle = "red";
        dis.fillRect(100, 100, 209, 160); //x, y, width, height

        // draw circle
        dis.fillStyle = "blue";
        dis.arc(300, 200, 50, 0, 360); // x, y, radius, start angle, end angle
        dis.fill();

        // draw line


        //draw Watch
        // dis.fillStyle = "gray";
        dis.beginPath();
        dis.arc(500, 300, 100, 0, 2 * Math.PI);
        dis.stroke();

        dis.beginPath();
        dis.fillStyle = "gray";
        dis.arc(500, 300, 3, 0,2 * Math.PI);
        dis.fill();

        dis.beginPath();

        dis.moveTo(500, 300);
        dis.lineTo(535, 270);
        dis.moveTo(500, 300);
        dis.lineTo(500, 220);

        dis.stroke();



    </script>

</body>

</html>
