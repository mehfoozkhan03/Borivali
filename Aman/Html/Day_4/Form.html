<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Country</legend>
            <select name="" id="">
                <option value="in">India</option>
                <option value="russ">Russia</option>
                <option value="eng">England</option>
            </select>
        </fieldset>
        <br><br>

        <input type="text" list="opt">
        <datalist id="opt">
            <option value="in">India</option>
            <option value="russ">Russia</option>
            <option value="eng">England</option>
        </datalist>
        <br><br>

        <fieldset>
            <legend>Gender</legend>
            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>

            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>
        </fieldset>

        <br><br>

        <fieldset>
            <legend>Programming Language</legend>
            <input type="checkbox" name="lang" id="java">
            <label for="java">Java</label>

            <input type="checkbox" name="lang" id="python">
            <label for="python">Python</label>

            <input type="checkbox" name="lang" id="javascript">
            <label for="javascript">Javascript</label>
        </fieldset>

    </form>
</body>

</html>
