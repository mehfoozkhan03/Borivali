<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elements in html</title>
    <style>
        .inline_element {
            background-color: lightblue;
        }

        .block_element {
            background-color: lightgreen;
        }

    </style>
</head>
<body>
    <span class="inline_element">This is an inline element.</span>
    <div class="block_element">This is a block element.</div>
</body>
</html>
