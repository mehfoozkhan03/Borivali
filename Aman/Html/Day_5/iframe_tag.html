<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe tag</title>
    <style>
        .mapouter {
            position: relative;
            text-align: right;
            width: 600px;
            height: 400px;
            margin: 100px 100px;
        }

        .gmap_canvas {
            overflow: hidden;
            background: none !important;
            width: 600px;
            height: 400px;
        }

        .gmap_iframe {
            width: 600px !important;
            height: 400px !important;
        }
    </style>
</head>

<body>
    <!-- google map -->
    <div class="mapouter">
        <div class="gmap_canvas">
            <iframe class="gmap_iframe" frameborder="0" scrolling="no" marginheight="0" marginwidth="0"
                src="https://maps.google.com/maps?q=borivali&output=embed">
            </iframe>
            <a href="https://embed-googlemap.com">embed google map</a>
        </div>
    </div>

    <!-- Youtube  -->
     <iframe width="600" height="500" src="https://www.youtube.com/embed/F2FmTdLtb_4" title="INDIA’S GOT LATENT S2 EP7 ft. Nawazuddin Siddiqui, Bhuvan Bam, Mukesh Chhabra, Kaustubh Agarwal" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>

</html>
