<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table and Form</title>
    <style>
        table{
            border-spacing: 3px;
        }

    </style>
</head>
<body>
    <table border="2" width="600">
        <thead>
                <th colspan="2">HTML5 Forms</th>
        </thead>
        <tbody>
            <tr>
                <td>Select your favorite color:</td>
                <td>
                    <form>
                        <input type="color">
                    </form>
                </td>
            </tr>
            <tr>
                <td>Birthday:</td>
                <td>
                    <form>
                        <input type="date">
                    </form>
                </td>
            </tr>
            <tr>
                <td>Birthday (date and time):</td>
                <td>
                    <form>
                        <input type="text">
                    </form>
                </td>
            </tr>
            <tr>
                <td>E-mail:</td>
                <td>
                    <form>
                        <input type="email">
                    </form>
                </td>
            </tr>
            <tr>
                <td>Birthday (month and year):</td>
                <td>
                    <form>
                        <input type="month">
                    </form>
                </td>
            </tr>
            <tr>
                <td>Quantity (between 1 and 5):</td>
                <td>
                    <form>
                        <input type="number" min="1" max="5">
                    </form>
                </td>
            </tr>
            <tr>
                <td>Points:</td>
                <td>
                    <form>
                        <input type="range">
                    </form>
            </tr>
            <tr>
                <td>Search Google:</td>
                <td>
                    <form>
                        <input type="search">
                    </form>
                </td>
            </tr>
            <tr>
                <td>Telephone:</td>
                <td>
                    <form>
                        <input type="tel">
                    </form>
                </td>
            </tr>
            <tr>
                <td>Add your homepage:</td>
                <td>
                    <form>
                        <input type="url">
                    </form>
            </tr>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
