<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>

</head>
<body>
    <table border="2">
        <thead>
            <tr>
                <th rowspan="3">Day</th>
                <th colspan="3">Seminar</th>
            </tr>
            <tr>
                <th colspan="2">Schedule</th>
                <th rowspan="2">Topic</th>
            </tr>
            <tr>
                <th>Begin</th>
                <th>End</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Monday</td>
                <td rowspan="2" bgcolor="#FFFFCC">8:00 a.m</td>
                <td rowspan="2" bgcolor="#CCCCFF">5:00 p.m</td>
                <td align="center">Introduction to XML</td>
                <tr>
                <td align="center" >Validity:DTD and Relax NG</td>
                </tr>
            </tr>
            <tr>
                <td rowspan="3">Tuesday</td>
                <td bgcolor="#FFFFCC">8:00 a.m</td>
                <td bgcolor="#FFFFCC">11:00 a.m</td>
                <td rowspan="2" align="center">XPath</td>
            <tr>
                <td bgcolor="#FFFFCC">11:00 a.m</td>
                <td bgcolor="#CCFFCC">2:00 p.m</td>
            </tr>
            <tr>
                <td bgcolor="#CCFFCC">2:00 p.m</td>
                <td bgcolor="#CCCCFF">5:00 p.m</td>
                <td align="center">XSL Transformations</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td bgcolor="#FFFFCC">8:00 a.m</td>
                <td bgcolor="#CCFFCC">12:00 p.m</td>
                <td align="center">XSL Formatting Objects</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
