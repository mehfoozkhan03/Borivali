<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outlined {
            border: solid;
        }
    </style>
</head>

<body>
    <marquee scrollamount="30" truespeed>This text will move from right to left</marquee>
    <marquee direction="up">This text will move from bottom to top</marquee>
    <marquee direction="down" height="250" width="200" behavior="alternate" class="outlined">
        <marquee behavior="alternate">This text will bounce</marquee>
    </marquee>

</body>

</html>
