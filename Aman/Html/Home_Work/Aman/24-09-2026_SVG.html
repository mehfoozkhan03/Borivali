<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scaler Vector Graphic</title>
    <style>
        text {
            /* background: transparent;
            -webkit-background-clip: text;
            color: red; */
        }
    </style>
</head>

<body>

    <svg width="600" height="350" style="border: 2px solid gray; margin:auto 75px">

        <!-- circle -->

        <circle cx="10px" cy="10px" r="50" fill="green" stroke="orange" stroke-width="2px"></circle>

        <circle cx="590px" cy="10px" r="50" fill="red" stroke="black" stroke-width="2px"></circle>

        <circle cx="10px" cy="350px" r="50" fill="blue" stroke="red" stroke-width="2px"></circle>

        <circle cx="590px" cy="350px" r="50" fill="yellow" stroke="aqua" stroke-width="2px"></circle>

        <!-- rectangle  -->

        <rect x="100" y="100" rx="100" ry="100" width="300" height="200" fill="tomato" stroke="purple" stroke-width="2px"></rect>


        <!-- line -->

        <line x1="0" y1="0" x2="600" y2="350" stroke="green" stroke-width="3px"></line>

        <line x1="600" y1="0" x2="0" y2="350" stroke="yellow" stroke-width="3px"></line>

        <!-- text  -->

        <text x="260" y="340" font-size="40px" fill="red" stroke="black" stroke-width="2px">this is svg</text>

    </svg>

</body>

</html>
