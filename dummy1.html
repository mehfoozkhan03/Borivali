<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-size: 1.5em;
        text-align: center;
      }

      .parent {
        /* height: 90vh; */
        border: 3px solid purple;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-areas:
          "g b f d"
          "e c a .";
        /* justify-content: center;*/
        /* justify-self: center; */
        justify-items: center;
        /*align-content: center; */
        gap: 10px;
      }

      .box {
        align-self: center;
        width: 200px;
        height: 200px;
        /* background: tomato; */
        border: 2px solid green;
        padding: 2rem 0;
      }

      .child_1 {
        background: tomato;
        grid-area: a;
      }
      .child_2 {
        background: teal;
        grid-area: b;
      }
      .child_3 {
        background: red;
        grid-area: c;
      }
      .child_4 {
        background: rebeccapurple;
        grid-area: d;
      }
      .child_5 {
        background: purple;
        grid-area: e;
      }
      .child_6 {
        background: blue;
        grid-area: f;
      }
      .child_7 {
        background: yellowgreen;
        grid-area: g;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="child_1 box">1</div>
      <div class="child_2 box">2</div>
      <div class="child_3 box">3</div>
      <div class="child_4 box">4</div>
      <div class="child_5 box">5</div>
      <div class="child_6 box">6</div>
      <div class="child_7 box">7</div>
    </div>
  </body>
</html>
