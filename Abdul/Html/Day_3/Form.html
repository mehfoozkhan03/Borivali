<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form tag's</title>
</head>
<body>
    <form>
<label for="name">User Name:</label>
<input type="text" id="name" minlength="1" maxlength="20" required placeholder="Enter your name...">
<br>
<br>
<label for="phone">User Phone:-</label>
<input type="tel" id="phone" minlength="1" maxlength="10" required placeholder="Enter your phone number...">
<br>
<br>
<label for="email">User Email:-</label>
<input type="email" id="email" minlength="1" maxlength="100" required placeholder="Enter your email address...">
<br>
<br>
<label for="age">User Age:-</label>
<input type="range" id="age" min="0" max="150" required>
<br>
<br>
<button type="submit">Submit</button>





    </form>

    



</body>
</html>
