<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    ol {
        background-color: gray;
        padding: 30px;
    }
    ul {
        background-color: #901212;
        padding: 50px;
    }
</style>

<body>
    <h1>Ordered List</h1>
    <ol type="A">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>

    <h1>Unordered List</h1>
    <ul type="square">
        <li>Item A</li>
        <li>Item B</li>
        <li>Item C</li> 
        </ul>

        <h1>Description List</h1>
        <dl>
            <dt>apple</dt>

            <dd>fruit</dd>
        </dl>
    
</body>
</html>
