<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elements in html </title>
</head>
<style>
    .block_element{
        background-color: rgb(19, 113, 142);
    }
    .inline_element{
        background-color: red;
    }
</style>
<body>
    <span class="inline_element">This is inline element 1</span>
    <div class="block_element">This is block element</div>
    <span class="inline_element">This is inline element 2</span>
    
</body>
</html>
