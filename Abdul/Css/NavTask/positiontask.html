<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    border: 2px solid black;
}

.parent{
    position: relative;
    height: 90vh;
    background-color:purple;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    gap: 10px;

    padding: 20px;
    margin: 20px;

    /* child access */
& > *{
    border: 2px solid black;
    height: 100%;
    width:50%;
}
}

.sub_child_2{
    position: relative;
}

.child_1{
    left:90px;
    top: 300px;
    background-color: red !important;
    width: 200px !important;
    z-index: 3;

   
}

.child_2{
    left:250px;
    top: 150px;
    background-color: yellow !important;
    width: 200px !important;
    z-index: 2;
    height: 200px !important;
}

.child_3{
    left:230px;
    top: 250px;
    width: 250px !important;
    z-index: 1;
    height: 200px !important;
}

.box{
    width: 100px;
    height: 100px;
    background-color: white;
    padding: 10px;
    position: absolute;
}




    </style>
</head>
<body>
   <div class="parent">
        <div class="sub_child_1">
            <h1>my name is abdul ahad memon</h1>
        </div>
        <div class="sub_child_2">
            <div class="child_1 box">child_1</div>
            <div class="child_2 box">child_2</div>
            <div class="child_3 box">child_3</div>

        </div>    

   </div>
        
    
</body>
</html>
