<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Forms</title>

    <style>
        table {
            width: 85%;
            border: 3px solid gray;
            border-collapse: separate;
            margin: 50px auto;
        }

        th {
            font-size: 28px;
            border: 2px solid gray;
            padding: 3px;
        }

        td {
            border: 2px solid gray;
            padding: 5px;
            font-size: 25px;
        }

        td:first-child {
            width: 55%;
        }

        input {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <table>

        <tr>
            <th colspan="2">HTML5 Forms</th>
        </tr>

        <tr>
            <td>Select your favorite color:</td>
            <td>
                <input type="color">
            </td>
        </tr>

        <tr>
            <td>Birthday:</td>
            <td>
                <input type="date">
            </td>
        </tr>

        <tr>
            <td>Birthday (date and time):</td>
            <td>
                <input type="datetime-local">
            </td>
        </tr>

        <tr>
            <td>E-mail:</td>
            <td>
                <input type="email">
            </td>
        </tr>

        <tr>
            <td>Birthday (month and year):</td>
            <td>
                <input type="month">
            </td>
        </tr>

        <tr>
            <td>Quantity (between 1 and 5):</td>
            <td>
                <input type="number" min="1" max="5">
            </td>
        </tr>

        <tr>
            <td>Points:</td>
            <td>
                <input type="range">
            </td>
        </tr>

        <tr>
            <td>Search Google:</td>
            <td>
                <input type="search">
            </td>
        </tr>

        <tr>
            <td>Telephone:</td>
            <td>
                <input type="tel">
            </td>
        </tr>

        <tr>
            <td>Add your homepage:</td>
            <td>
                <input type="url">
            </td>
        </tr>

    </table>

</body>
</html>
