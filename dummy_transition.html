<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background: black;
        cursor: pointer;
      }

      div {
        width: 300px;
        height: 200px;
        background: tomato;

        text-align: center;
        padding: 3rem 0;
        margin: 12rem auto;
        font:  900 6rem italic;
     
        text-transform: capitalize;
      }

      div:hover {
        background: teal;
        color: brown;
        margin: 0 auto;
        transition: all 2s ease-in-out;

        /* transition-behavior: allow-discrete ; */
      }
    </style>
  </head>
  <body>
    <div>hello</div>
  </body>
</html>
