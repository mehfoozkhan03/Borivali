<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      img {
        animation: react 1s linear 0.2s infinite;
      }


      @keyframes react {
        0%{
            rotate: 0deg;
        }
        100%{
            rotate: 360deg;
        }
      }


      img:hover{
        animation-play-state: paused;
      }

    </style>
  </head>
  <body>
    <img src="../../../../Utils/react-svgrepo-com.svg" alt="" />
  </body>
</html>
