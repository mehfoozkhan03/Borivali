<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>selector and combinator</title>
    <style>
      /* attribute selector's */
      [name="email"] {
        color: red;
      }

      /* Decendent Combinator's  ( ) */
      /* 
      div  h3 {
            background: tomato;
        } */

      /* Child Combinator's  (>)*/

      /* div > h3 {
        color: green;
      } */

      /* next-sibling (+) && sub-sibling (~) */

      /* div ~ h1 {
        background-color: black;
        color: red;
      }
       */
      /* h1 + h1 {
        background-color: black;
        color: red;
      } */

      /* nesting selector (&)*/

      main > div {
        background: tomato;
        border: 7px solid red;
        &  > *:hover {
          color: blue;
        }
      }
      
      /* h1:hover{
        color: blue;
     } */
    </style>
  </head>
  <body>
    <!-- 
    * selector :- 
                1. universal 
                2. id
                3. class
                4. elements | name
                5. attribute   

    ? Combinator's :-    
                1. Decendent ( ) {content present then  effect}
                2. Child (>) {direct child effect}
                3. next-sibling (+)
                4. sub-sibling (~) 
    -->
