<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ice_cream</title>
    <style>
      input[type="range"] {
        /* -webkit-appearance: none; */
        appearance: none;
        background: transparent;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        background-color: red;
        height: 8px;
        border-radius: 4px;
      }

      input[type="range"]::-webkit-slider-thumb {
        appearance: inherit;
        margin-top: -6px;
        background: red;
        height: 20px;
        width: 20px;
        border-radius: 50%;
        border: 1px solid gray;
      }
      div{
        border: 3px solid gray;
      }
    </style>
  </head>
  <body>
    <!-- <canvas width="800" height="600" style="border: 2px solid red"></canvas> -->

    <div>
      <input type="range" />
    </div>

    <!-- <script>
      const canvas = document.querySelector("canvas");

      const dis = canvas.getContext("2d");      
    </script> -->
  </body>
</html>
