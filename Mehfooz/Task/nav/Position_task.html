<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body{
        border: 3px solid black;
      }

      .parent {
        position: relative;
        height: 90vh;
        background: rgb(103, 46, 160);
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        gap: 10px;

        padding: 20px;
        margin: 20px;
        /* child access */
        & > * {
          border: 2px solid red;
          width: 50%;
          height: 100%;
        }
      }

      .sub_child_2{
        position: relative;
      }


      .child_1{
        left: 90px;
        top: 300px;
        background: tomato !important;
        width: 200px !important;
        z-index: 3;
    }
    .child_2{
        left: 250px;
        background: teal !important;
        top: 150px;
        width: 200px !important;
        z-index: 2;
        height: 200px !important;
      }
      .child_3{
        left: 230px;
        top: 250px;
        width: 250px !important;
        height: 200px !important;
        z-index: 1;
      }
    
      .box {
        width: 100px;
        height: 100px;
        background: wheat;
        padding: 10px;
         position: absolute;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="sub_child_1">
        <h1>kvjivsdivsivbpsivbsipvbsvisdvbpisbvpis</h1>
      </div>
      <div class="sub_child_2">
          <div class="child_1 box">child_1</div>
          <div class="child_2 box">child_2</div>
        <div class="child_3 box">child_3</div>
      </div>
    </div>
  </body>
</html>
