<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form tag's</title>
</head>

<body>
    <form>
        <label for="user">user name :- </label>
        <input name="name" autocomplete="off" id="user" type="text" minlength="4" maxlength="10"
            placeholder="enter your name..." required>

        <br>
        <br>
        <label for="phone">user phone :- </label>
        <input name="phone" id="phone" type="tel" min="4" max="10" placeholder="enter your phone number..." required>

        <br>
        <br>
        <label for="email">user email :- </label>
        <input name="email" id="email" type="email" placeholder="enter your email id..." required>

        <br>
        <br>
        <label for="age">user age :- </label>
        <input name="age" id="age" type="range" required>

        <br>
        <br>
        <button type="submit">submit</button>
        <!--
        type
        1. pending button explanation 
        2. drop-down | check-box | radio
        -->

    </form>

</body>

</html>
