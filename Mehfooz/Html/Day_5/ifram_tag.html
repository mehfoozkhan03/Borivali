<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-Frame tag's</title>
    <style>
        .mapouter {
            position: relative;
            text-align: right;
            width: 600px;
            height: 400px;
            margin: 100px 100px;
        }

        .gmap_canvas {
            overflow: hidden;
            background: none !important;
            width: 600px;
            height: 400px;
        }

        .gmap_iframe {
            width: 600px !important;
            height: 400px !important;
        }
    </style>
</head>

<body>
    <!-- google map -->

    <div class="mapouter">
        <div class="gmap_canvas">
            <iframe class="gmap_iframe" frameborder="0"
                src="https://maps.google.com/maps?q=borivali&output=embed"></iframe><a
                href="https://embed-googlemap.com">google maps embed</a>
        </div>
    </div>

    <!-- youtube -->

    <iframe width="933" height="525" src="https://www.youtube.com/embed/F2FmTdLtb_4"
        title="How Operating Systems ACTUALLY work (kernel mode vs. user mode)" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>



</body>

</html>
